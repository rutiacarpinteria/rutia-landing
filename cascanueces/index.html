<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon_rutia.ico">
<title>Farola grande Cascanueces</title>
<style>
/* estilo "anatomy": papel, líneas finas, cuatro tonos, un solo acento */
:root{
  --page:#f2f2ef; --card:#fbfbfa; --text:#57575a; --strong:#18181a; --muted:#8c8c90;
  --face:#ffffff; --shade-0:#dcdcd9; --shade-1:#e5e5e2; --shade-2:#ededea; --shade-3:#f4f4f1;
  --hi:#26262a; --mid:#8a8a8f; --lo:#b4b4b8; --faint:#d4d4d6;
  --accent:#e5484d; --accent-ink:#ffffff;
  --lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0b0b0b; --card:#131313; --text:#a3a3a3; --strong:#e6e6e6; --muted:#6e6e6e;
    --face:#262626; --shade-0:#141414; --shade-1:#181818; --shade-2:#1c1c1c; --shade-3:#212121;
    --hi:#d4d4d4; --mid:#6a6a6a; --lo:#3e3e3e; --faint:#2a2a2a;
    --accent:#ff6b6b; --accent-ink:#1a0f0e;
    --lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 3px 3px -1.5px #00000014,0 12px 12px -6px #00000014;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0b0b0b; --card:#131313; --text:#a3a3a3; --strong:#e6e6e6; --muted:#6e6e6e;
  --face:#262626; --shade-0:#141414; --shade-1:#181818; --shade-2:#1c1c1c; --shade-3:#212121;
  --hi:#d4d4d4; --mid:#6a6a6a; --lo:#3e3e3e; --faint:#2a2a2a;
  --accent:#ff6b6b; --accent-ink:#1a0f0e;
  --lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 3px 3px -1.5px #00000014,0 12px 12px -6px #00000014;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px;padding-block:14px 10px}
h1{font-size:19px;font-weight:600;margin:0;color:var(--strong);letter-spacing:-.01em;text-wrap:balance}
.sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding-bottom:16px}
main > *{min-width:0}

/* lámina */
#stage{position:relative;min-height:320px;background:var(--card);box-shadow:0 0 0 1px var(--mid);overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.corner{position:absolute;font-family:var(--mono);font-size:10.5px;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;pointer-events:none}
.c-fig{top:14px;left:14px;color:var(--text);letter-spacing:.04em;text-transform:none}
.c-hint{bottom:14px;left:14px;white-space:normal;max-width:calc(100% - 90px);line-height:1.4;letter-spacing:.06em}
.c-read{bottom:14px;right:56px;color:var(--text);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.toolbar{position:absolute;right:12px;top:10px;display:flex;gap:4px}
.toolbar button{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;background:var(--card)}

/* slider vertical dentro de la lámina */
.vslider{position:absolute;right:10px;top:46px;bottom:40px;width:36px;display:flex;flex-direction:column;align-items:center;gap:6px}
.vslider .end{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg)}
.vslider input{flex:1;min-height:80px;width:28px;margin:0;writing-mode:vertical-lr;direction:rtl;-webkit-appearance:slider-vertical;appearance:slider-vertical;accent-color:var(--hi);touch-action:none}
.vslider button{width:34px;height:34px;padding:0;border-radius:50%;font-size:12px;line-height:1}
.vslider[hidden]{display:none}

aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding:1px}
.block{background:var(--card);box-shadow:var(--lift);border-radius:8px;padding:12px}
.label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;box-shadow:0 0 0 1px var(--faint);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;box-shadow:none}
.seg button[aria-pressed="true"]{background:var(--strong);color:var(--card)}
button{font:500 13px var(--sans);color:var(--strong);background:var(--card);border:0;box-shadow:0 0 0 1px var(--lo);border-radius:6px;padding:7px 10px;cursor:pointer;
  transition:box-shadow .2s var(--ease),background-color .2s var(--ease)}
button:hover{box-shadow:0 0 0 1px var(--mid)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--strong);color:var(--card);box-shadow:none}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
#stepTitle{font-size:15px;font-weight:600;color:var(--strong);margin:0 0 2px}
#stepText{margin:0 0 10px;line-height:1.45}
.count{font-family:var(--mono);font-size:11px;color:var(--muted)}
ol.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
ol.parts li button{width:100%;display:grid;grid-template-columns:12px 30px 1fr;gap:8px;align-items:center;text-align:left;box-shadow:none;background:transparent;padding:5px 6px;font-weight:400;color:var(--text)}
ol.parts li button:hover{background:var(--shade-3)}
ol.parts li button[aria-current="true"]{box-shadow:0 0 0 1px var(--accent);color:var(--strong)}
ol.parts li button.off{opacity:.4}
.sw{width:10px;height:10px;border-radius:2px;box-shadow:0 0 0 1px var(--mid)}
.toolbar button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--accent);color:var(--accent)}
.code{font-family:var(--mono);font-size:11px;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono);font-size:12px;color:var(--strong);font-variant-numeric:tabular-nums}
@media (min-width:761px){ body{overflow:hidden} }
@media (max-width:760px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(320px,62vh) auto}
  aside{overflow:visible}
  body{height:auto}
  .c-read{display:none}
}
</style>
</head>
<body>

<header>
  <h1>Farola grande · El Cascanueces</h1>
  <span class="sub">9 piezas · MDF 9 mm · medias maderas · rejilla → tapas → espalda</span>
</header>
<main>
  <div id="stage">
    <span class="corner c-fig">FIG. 1 — despiece</span>
    <div class="toolbar">
      <button id="btnMarks" type="button" aria-pressed="true" title="Mostrar u ocultar la marca de cara A">Cara A</button>
      <button id="btnColor" type="button" aria-pressed="false" title="Ver en blanco o por colores de capa">Colores</button>
      <button id="btnView" type="button" title="Volver a la vista inicial">Centrar</button>
    </div>
    <div class="vslider" id="explodeBox">
      <span class="end">Despiece</span>
      <input id="slider" type="range" min="0" max="1000" value="0" orient="vertical" aria-label="Separación de las piezas (arriba: despiece, abajo: armada)">
      <span class="end">Armada</span>
      <button id="btnPlay" type="button" class="primary" aria-label="Animar">▶</button>
    </div>
    <span class="corner c-hint">Arrastrá para girar · pellizcá para acercar · tocá una pieza</span>
    <span class="corner c-read" id="readout"></span>
  </div>
  <aside>
    <div class="block">
      <p class="label">Modo</p>
      <div class="seg" role="group" aria-label="Modo">
        <button id="mExplode" type="button" aria-pressed="true">Despiece</button>
        <button id="mSteps" type="button" aria-pressed="false">Armado paso a paso</button>
      </div>
    </div>

    <div class="block" id="stepsBox" hidden>
      <div class="row" style="justify-content:space-between"><p class="label" style="margin:0">Paso</p><span class="count" id="stepCount"></span></div>
      <p id="stepTitle"></p>
      <p id="stepText"></p>
      <div class="row">
        <button id="btnPrev" type="button">← Anterior</button>
        <button id="btnNext" type="button" class="primary">Siguiente →</button>
      </div>
    </div>

    <div class="block">
      <p class="label">Piezas (orden de armado)</p>
      <ol class="parts" id="parts"></ol>
    </div>

    <div class="block" id="infoBox">
      <p class="label">Pieza seleccionada</p>
      <dl id="info"><dt>—</dt><dd>Tocá una pieza</dd></dl>
    </div>
  </aside>
</main>

const all = new THREE.Box3();
PIECES.forEach(p => {
  const shape = new THREE.Shape(p.outer.map(q => new THREE.Vector2(q[0], q[1])));
  p.holes.forEach(h => shape.holes.push(new THREE.Path(h.map(q => new THREE.Vector2(q[0], q[1])))));
  const depth = Math.hypot(p.n[0], p.n[1], p.n[2]);
  const geo = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled:false, curveSegments:1});
  const nh = p.n.map(c => c/depth);
  const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(...p.u), new THREE.Vector3(...p.v), new THREE.Vector3(...nh));
  m.setPosition(p.o[0], p.o[1], p.o[2]);
  geo.applyMatrix4(m);
  geo.computeBoundingBox();
  p.color = (p.color[0]<<16)|(p.color[1]<<8)|p.color[2];
  const mat = inkMaterial();
  const mesh = new THREE.Mesh(geo, mat);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), new THREE.LineBasicMaterial({color:theme.hi.clone(), transparent:true, opacity:.9}));
  mesh.add(edges);
  // marca cara A
  const mk = p.mark, s = mk.size;
  const mmat = new THREE.MeshBasicMaterial({map:markTexture(p.code), transparent:true, side:THREE.FrontSide, depthWrite:false});
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(s, s), mmat);
  const N = new THREE.Vector3(...mk.nrm), U = new THREE.Vector3(...mk.up), Rt = new THREE.Vector3().crossVectors(U, N);
  const pm = new THREE.Matrix4().makeBasis(Rt, U, N); pm.setPosition(mk.p[0], mk.p[1], mk.p[2]);
  plane.applyMatrix4(pm); plane.renderOrder = 2;
  mesh.add(plane);
  mesh.userData.code = p.code;
  world.add(mesh);
  meshes[p.code] = {mesh, mat, edges, plane, p, box:geo.boundingBox.clone(), u:new THREE.Vector3(...p.u)};
  all.union(geo.boundingBox);
});
const C = all.getCenter(new THREE.Vector3());
world.position.set(-C.x, -C.z, C.y);
const size = all.getSize(new THREE.Vector3());

// ---------- desplazamientos por etapa (coordenadas Rhino; frente = -Y)
// etapa 1: costillas salen hacia el frente por su propio plano; etapa 2: tapas salen en vertical (T1 arriba, T2 abajo);
// etapa 3: la rejilla entera se separa de la espalda hacia el frente
const D_RIB = 230, D_LID = 200, D_GRID = 330;
const own = {};
CODES.forEach(c => {
  const it = meshes[c];
  if(c[0] === 'C') own[c] = it.u.clone().multiplyScalar(-D_RIB);
  else if(c[0] === 'T') own[c] = new THREE.Vector3(0, 0, c === 'T1' ? D_LID : -D_LID);
  else own[c] = new THREE.Vector3();
});
const gridOff = new THREE.Vector3(0, -D_GRID, 0);

// ---------- estado
let mode = 'explode', t = 0, step = 0, selected = null, colorMode = 'paper', marks = true;
const pOwn = {}, tOwn = {}, vis = {};
CODES.forEach(c => { pOwn[c] = 0; tOwn[c] = 0; vis[c] = 1; });
let pGrid = 0, tGrid = 0;
const ease = x => x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const clamp01 = x => Math.min(1, Math.max(0, x));
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function explodeTargets(){
  // desarmar = armado al revés: rejilla de la espalda, tapas, costillas
  tGrid = ease(clamp01(t / 0.36));
  const lid = ease(clamp01((t - 0.30) / 0.36));
  const rib = ease(clamp01((t - 0.62) / 0.38));
  CODES.forEach(c => { vis[c] = 1; tOwn[c] = c[0]==='T' ? lid : c[0]==='C' ? rib : 0; });
}
function stepTargets(){
  const shown = new Set(); STEPS.slice(0, step+1).forEach(s => s.show.forEach(c => shown.add(c)));
  CODES.forEach(c => { tOwn[c] = 0; vis[c] = shown.has(c) ? 1 : 0.12; });
  tGrid = step >= STEPS.length-1 ? 0 : 1;
}

function setMode(m){
  mode = m;
  document.getElementById('mExplode').setAttribute('aria-pressed', m==='explode');
  document.getElementById('mSteps').setAttribute('aria-pressed', m==='steps');
  document.getElementById('explodeBox').hidden = m!=='explode';
  document.getElementById('stepsBox').hidden = m!=='steps';
  if(m==='steps'){ step = 0; pGrid = 1; CODES.forEach(c => pOwn[c] = 0); updateStep(); }
  else { selected = null; explodeTargets(); select(null); }
}
function updateStep(){
  stepTargets();
  const s = STEPS[step];
  if(!reduce) s.move.forEach(c => { if(c === 'G') pGrid = 1; else pOwn[c] = 1; });  // entra animada
  document.getElementById('stepCount').textContent = (step+1) + ' / ' + STEPS.length;
  document.getElementById('stepTitle').textContent = s.code + ' · ' + s.title;
  document.getElementById('stepText').textContent = s.text;
  document.getElementById('btnPrev').disabled = step === 0;
  document.getElementById('btnNext').textContent = step === STEPS.length-1 ? 'Volver a empezar' : 'Siguiente →';
  select(s.show.length === 1 ? s.show[0] : null);
}
const cap = s => s.toLowerCase().replace(/^./, m => m.toUpperCase());
const stepOf = c => STEPS.findIndex(s => s.show.includes(c));

// ---------- lista e info
const list = document.getElementById('parts');
function renderList(){
  list.innerHTML = '';
  CODES.forEach(c => {
    const p = byCode[c]; if(!p) return;
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button';
    const col = p.color;
    b.innerHTML = '<span class="sw" style="background:#' + col.toString(16).padStart(6,'0') + '"></span><span class="code">' + c + '</span><span>' + cap(p.name) + '</span>';
    if(selected === c) b.setAttribute('aria-current', 'true');
    if(mode==='steps' && stepOf(c) > step) b.classList.add('off');
    b.addEventListener('click', () => { if(mode==='steps'){ step = stepOf(c); pGrid = 1; CODES.forEach(k => pOwn[k] = 0); updateStep(); } else select(c); });
    li.appendChild(b); list.appendChild(li);
  });
}
const FACE_TXT = {E:'al frente, flecha arriba', C1:'hacia afuera, flecha arriba', C2:'a la izquierda, flecha arriba', C3:'hacia el centro, flecha arriba'};
function dims(p){
  let mn=[1e9,1e9], mx=[-1e9,-1e9];
  p.outer.forEach(q => { mn[0]=Math.min(mn[0],q[0]); mn[1]=Math.min(mn[1],q[1]); mx[0]=Math.max(mx[0],q[0]); mx[1]=Math.max(mx[1],q[1]); });
  const a = mx[0]-mn[0], b = mx[1]-mn[1];
  return [Math.max(a,b), Math.min(a,b)];
}
function select(code){
  selected = code;
  applyLook();
  const info = document.getElementById('info');
  if(!code){ info.innerHTML = '<dt>—</dt><dd>Tocá una pieza</dd>'; renderList(); return; }
  const p = meshes[code].p, d = dims(p);
  info.innerHTML =
    '<dt>Pieza</dt><dd>' + code + ' ' + cap(p.name) + '</dd>' +
    '<dt>Largo</dt><dd>' + d[0].toFixed(1) + ' mm</dd>' +
    '<dt>Ancho</dt><dd>' + d[1].toFixed(1) + ' mm</dd>' +
    '<dt>Espesor</dt><dd>9 mm MDF</dd>' +
    '<dt>Cara A</dt><dd>' + (FACE_TXT[code] || 'hacia abajo, flecha al frente') + '</dd>' +
    (p.holes.length ? '<dt>Calados</dt><dd>' + p.holes.length + '</dd>' : '');
  renderList();
}

// ---------- aspecto (tonos del tema, colores de capa, acento en la selección)
function applyLook(){
  CODES.forEach(c => {
    const it = meshes[c], u = it.mat.uniforms;
    TONES.forEach((n, i) => u['t'+i].value.copy(theme[n]));
    it.edges.material.color.copy(theme.hi);
    if(c === selected){ u.tint.value.copy(theme.accent); u.tintAmt.value = .38; }
    else if(colorMode === 'layers'){ u.tint.value.setHex(it.p.color); u.tintAmt.value = .55; }
    else u.tintAmt.value = 0;
  });
}
const readout = document.getElementById('readout');
function setPlay(on){
  playing = on;
  btnPlay.textContent = on ? '❚❚' : '▶';
  btnPlay.setAttribute('aria-label', on ? 'Pausa' : 'Animar');
}
const mq = window.matchMedia('(prefers-color-scheme: dark)');
(mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(() => {
  readTheme(); applyLook();
  CODES.forEach(c => { const pl = meshes[c].plane; pl.material.map = markTexture(c); pl.material.needsUpdate = true; });
});

// ---------- vista
function resetView(){
  const r = Math.max(size.x, size.y, size.z);
  // isométrica: azimut 45°, elevación 30°, desde adelante-izquierda
  const tg = new THREE.Vector3(0, 0, 160), az = Math.PI/4, el = Math.PI/6;
  controls.target.copy(tg);
  camera.position.copy(tg).add(new THREE.Vector3(-Math.sin(az)*Math.cos(el), Math.sin(el), Math.cos(az)*Math.cos(el)).multiplyScalar(r*4));
  camera.zoom = 1; camera.updateProjectionMatrix();
  controls.update();
}
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  const half = Math.max(size.x, size.y, size.z) * 0.62, asp = w/h;
  const hh = asp >= 1 ? half : half/asp;   // en vertical (celular) entra todo a lo ancho
  camera.left = -hh*asp; camera.right = hh*asp; camera.top = hh; camera.bottom = -hh;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

// ---------- selección tocando
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if(!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(CODES.map(c => meshes[c].mesh), false);
  const hit = hits.find(h => vis[h.object.userData.code] > .5);
  select(hit ? hit.object.userData.code : null);
});

// ---------- controles
const slider = document.getElementById('slider');
const btnPlay = document.getElementById('btnPlay');
let playing = false, dir = 1;
slider.addEventListener('input', () => { t = slider.value/1000; playing = false; setPlay(false); explodeTargets(); });
btnPlay.addEventListener('click', () => { playing = !playing; if(playing && (t>=1||t<=0)) dir = t>=1 ? -1 : 1; setPlay(playing); });
document.getElementById('mExplode').addEventListener('click', () => setMode('explode'));
document.getElementById('mSteps').addEventListener('click', () => setMode('steps'));
document.getElementById('btnPrev').addEventListener('click', () => { if(step>0){ step--; pGrid = 1; CODES.forEach(c => pOwn[c] = 0); updateStep(); } });
document.getElementById('btnNext').addEventListener('click', () => { step = step < STEPS.length-1 ? step+1 : 0; if(step===0){ pGrid = 1; } updateStep(); });
document.getElementById('btnView').addEventListener('click', resetView);
const btnColor = document.getElementById('btnColor');
btnColor.addEventListener('click', () => {
  colorMode = colorMode==='paper' ? 'layers' : 'paper';
  btnColor.setAttribute('aria-pressed', colorMode==='layers');
  applyLook();
  renderList();
});
const btnMarks = document.getElementById('btnMarks');
btnMarks.addEventListener('click', () => { marks = !marks; btnMarks.setAttribute('aria-pressed', marks); });

// ---------- loop
let last = performance.now();
const tmp = new THREE.Vector3();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if(playing && mode==='explode'){
    t += dir * dt / 4;
    if(t >= 1 || t <= 0){ t = clamp01(t); setPlay(false); }
    slider.value = Math.round(t*1000); explodeTargets();
  }
  const k = reduce ? 1 : 1 - Math.pow(0.02, dt);
  if(mode==='explode'){ pGrid = tGrid; CODES.forEach(c => pOwn[c] = tOwn[c]); }
  else { pGrid += (tGrid - pGrid) * k; CODES.forEach(c => pOwn[c] += (tOwn[c] - pOwn[c]) * k); }
  CODES.forEach(c => {
    const it = meshes[c];
    tmp.copy(own[c]).multiplyScalar(pOwn[c]);
    if(c !== 'E') tmp.addScaledVector(gridOff, pGrid);
    it.mesh.position.copy(tmp);
    const o = vis[c];
    it.mat.transparent = o < 1; it.mat.uniforms.opacity.value = o; it.mat.depthWrite = o >= 1;
    it.edges.material.opacity = .9 * o;
    it.plane.visible = marks && o >= 1;
  });
  readout.textContent = mode==='explode' ? 'separación ' + String(Math.round(t*100)).padStart(3,' ') + ' %' : 'paso ' + (step+1) + ' / ' + STEPS.length;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize(); resetView(); applyLook();
t = 0.5; slider.value = 500; explodeTargets(); renderList();
requestAnimationFrame(frame);
})();
</script>
